name: Allure Report Pipeline

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

    # 📥 Checkout main code
    - name: Checkout code
      uses: actions/checkout@v4

    # ☕ Setup Java
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    # 📦 Install unzip
    - name: Install unzip
      run: sudo apt-get update && sudo apt-get install unzip -y

    # 📊 Install Allure
    - name: Install Allure
      run: |
        wget https://repo.maven.apache.org/maven2/io/qameta/allure/allure-commandline/2.24.0/allure-commandline-2.24.0.zip
        unzip allure-commandline-2.24.0.zip
        sudo mv allure-2.24.0 /opt/allure
        sudo ln -s /opt/allure/bin/allure /usr/bin/allure

    # 🧪 Run tests
    - name: Run tests
      run: mvn clean test

    # 📂 Checkout gh-pages branch (for history)
    - name: Checkout gh-pages
      uses: actions/checkout@v4
      with:
        ref: gh-pages
        path: gh-pages
      continue-on-error: true

    # 📈 Generate Allure Report with history
    - name: Generate Allure Report
      run: |
        mkdir -p target/allure-results/history
        cp -r gh-pages/history target/allure-results/ || true
        allure generate target/allure-results --clean -o allure-report

    # 💾 Copy history for next run
    - name: Save history
      run: |
        mkdir -p gh-pages
        cp -r allure-report/history gh-pages/history

    # 🚀 Deploy report to GitHub Pages
    - name: Deploy Allure Report
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: allure-report

    # 📧 Send Email (optional)
    - name: Send Email
      uses: dawidd6/action-send-mail@v3
      continue-on-error: true
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "Allure Test Report"
        to: dnyaneshwar.tahakik@indiconnect.in
        from: ${{ secrets.EMAIL_USERNAME }}
        body: |
          Test execution completed successfully.

          View Allure Report:
          https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

          Thank you.
