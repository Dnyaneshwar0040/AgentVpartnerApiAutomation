name: Run Tests and Send Allure Report

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # ✅ FIXED Allure installation
    - name: Install Allure
      run: |
        wget https://github.com/allure-framework/allure2/releases/latest/download/allure-2.27.0.tgz
        tar -zxvf allure-2.27.0.tgz
        sudo mv allure-2.27.0 /opt/allure
        sudo ln -s /opt/allure/bin/allure /usr/bin/allure

    - name: Run tests
      run: mvn clean test

    - name: Generate Allure Report
      run: allure generate target/allure-results --clean -o allure-report

    # ✅ Upload report (BEST PRACTICE)
    - name: Upload Report Artifact
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: allure-report

    # ⚠️ Email (optional – may fail if report large)
    - name: Send Email
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "Test Report"
        to: dnyaneshwar.tahakik@indiconnect.in
        from: ${{ secrets.EMAIL_USERNAME }}
        body: "Allure report generated. Download from GitHub Actions artifacts."
