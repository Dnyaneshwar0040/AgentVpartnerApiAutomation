name: Run Tests and Send Allure Report

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Allure
      run: |
        sudo apt-add-repository ppa:qameta/allure -y
        sudo apt-get update
        sudo apt-get install allure -y

    - name: Run tests
      run: mvn clean test

    - name: Generate Allure Report
      run: allure generate target/allure-results --clean -o allure-report

    - name: Upload Report Artifact
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: allure-report

    - name: Send Email
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.tahakik9767official@gmail.com }}
        password: ${{ secrets.Tahakik@123 }}
        subject: "Test Report"
        to: dnyaneshwar.tahakik@indiconnect.in
        from: tahakik9767@gmail.com
        body: "Allure report attached"
        attachments: allure-report/**
