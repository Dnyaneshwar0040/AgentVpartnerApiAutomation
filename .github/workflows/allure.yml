name: Run Tests and Generate Allure Report

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

    # 📥 Checkout code
    - name: Checkout code
      uses: actions/checkout@v4

    # ☕ Setup Java
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 📦 Install unzip & zip
    - name: Install unzip and zip
      run: sudo apt-get update && sudo apt-get install unzip zip -y

    # 📊 Install Allure
    - name: Install Allure
      run: |
        wget https://repo.maven.apache.org/maven2/io/qameta/allure/allure-commandline/2.24.0/allure-commandline-2.24.0.zip
        unzip allure-commandline-2.24.0.zip
        sudo mv allure-2.24.0 /opt/allure
        sudo ln -s /opt/allure/bin/allure /usr/bin/allure

    # 🧪 Run tests
    - name: Run tests
      run: mvn clean test

    # 📈 Generate Allure Report
    - name: Generate Allure Report
      run: allure generate target/allure-results --clean -o allure-report

    # 📦 Zip report (optional for download)
    - name: Zip Allure Report
      run: zip -r allure-report.zip allure-report

    # 📤 Upload artifact
    - name: Upload Allure Report
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: allure-report.zip

    # 📧 Send Email (SAFE version - no attachment)
    - name: Send Email
      uses: dawidd6/action-send-mail@v3
      continue-on-error: true
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "Test Execution Completed"
        to: dnyaneshwar.tahakik@indiconnect.in
        from: ${{ secrets.EMAIL_USERNAME }}
        body: |
          Your automation test run is completed successfully.

          View report here:
          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Go to Artifacts section to download the report.

          Thank you.
